<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante - Pedidos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Restaurante</h1>
        <button id="btn-cart" onclick="toggleCart()">
            Carrito (<span id="cart-count">0</span>)
        </button>
    </header>

    <main>
        <section id="categorias">
            <button class="cat-btn active" onclick="filtrarCategoria('todas')">Todas</button>
        </section>

        <section id="productos" class="grid"></section>
    </main>

    <aside id="cart" class="cart-hidden">
        <div class="cart-header">
            <h2>Tu Pedido</h2>
            <button onclick="toggleCart()">X</button>
        </div>
        <div id="cart-items"></div>
        <div class="cart-footer">
            <p>Total: $<span id="cart-total">0</span></p>
            <button id="btn-order" onclick="crearPedido()">Confirmar Pedido</button>
        </div>
    </aside>

    <div id="modal" class="modal-hidden">
        <div class="modal-content">
            <p id="modal-msg"></p>
            <button onclick="cerrarModal()">Aceptar</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
